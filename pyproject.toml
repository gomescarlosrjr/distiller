[project]
name = "distiller"
version = "0.1.0"
description = "Convert documents (PDF, EPUB, DOCX, images, ...) to Markdown and retrieval-ready chunks via Docling. Local-first, optional VLM extraction, PG-Vector-ready export."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.15",
    "streamlit>=1.38",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
distiller = "distiller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distiller"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
